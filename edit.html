<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student - Host Portal</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px;}
        .form-container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 450px; }
        h2 { color: #333; text-align: center; margin-bottom: 20px; }
        label { font-weight: bold; font-size: 14px; color: #555; display: block; margin-top: 10px; }
        input[type="text"], input[type="email"], select { width: 95%; padding: 10px; margin: 8px 0 15px 0; border: 1px solid #ccc; border-radius: 4px; }
        input[readonly] { background-color: #e9ecef; cursor: not-allowed; }
        
        /* Camera Styles */
        .camera-box { text-align: center; margin-bottom: 20px; background: #e8f4f8; padding: 15px; border-radius: 8px; border: 1px solid #b3d4fc;}
        video { width: 100%; border-radius: 4px; background: #000; }
        .btn-capture { background-color: #3498db; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; margin-top: 10px; width: 100%; font-weight: bold; font-size: 14px;}
        .btn-capture:hover { background-color: #2980b9; }
        .photo-status { font-size: 13px; color: #555; margin-top: 8px; font-weight: bold; }

        .btn-submit { background-color: #f39c12; color: white; border: none; padding: 12px; width: 100%; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.3s; }
        .btn-submit:hover { background-color: #d35400; }
        .cancel-link { display: block; text-align: center; margin-top: 15px; color: #e74c3c; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Edit Student Details</h2>
    
    <form action="/edit/{{ student[0] }}" method="POST" id="editForm">
        <label>Registration Number (ID - Cannot be changed)</label>
        <input type="text" value="{{ student[0] }}" readonly>

        <label>Full Name</label>
        <input type="text" name="name" value="{{ student[1] }}" required>

        <label>Department</label>
        <input type="text" name="department" value="{{ student[2] }}" required>

        <label>Gender</label>
        <select name="gender" required>
            <option value="Male" {% if student[3] == 'Male' %}selected{% endif %}>Male</option>
            <option value="Female" {% if student[3] == 'Female' %}selected{% endif %}>Female</option>
            <option value="Other" {% if student[3] == 'Other' %}selected{% endif %}>Other</option>
        </select>

        <label>Email Address</label>
        <input type="email" name="email" value="{{ student[4] }}">

        <label>Guardian Name</label>
        <input type="text" name="guardian" value="{{ student[5] }}">

        <!-- OPTIONAL CAMERA SECTION -->
        <div class="camera-box">
            <label style="margin-top: 0; color: #2980b9;">Optional: Update Face Data</label>
            <p style="font-size: 12px; color: #666; margin-top: 0;">Only use this if you want to overwrite their existing photos.</p>
            <video id="video" autoplay></video>
            <button type="button" id="captureBtn" class="btn-capture">📷 Start New Capture (0/5)</button>
            <div id="statusText" class="photo-status">No new photos taken yet.</div>
            <canvas id="canvas" style="display:none;"></canvas>
        </div>

        <input type="hidden" name="image1" id="image1">
        <input type="hidden" name="image2" id="image2">
        <input type="hidden" name="image3" id="image3">
        <input type="hidden" name="image4" id="image4">
        <input type="hidden" name="image5" id="image5">

        <!-- Note: Button is enabled by default so text-only edits work -->
        <button type="submit" class="btn-submit" id="submitBtn">Update Student</button>
    </form>
    
    <a href="/manage" class="cancel-link">Cancel and Go Back</a>
</div>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const captureBtn = document.getElementById('captureBtn');
    const statusText = document.getElementById('statusText');
    const submitBtn = document.getElementById('submitBtn');
    let captureCount = 0;

    navigator.mediaDevices.getUserMedia({ video: true })
        .then(stream => { video.srcObject = stream; })
        .catch(err => { statusText.innerHTML = "<span style='color:red;'>Camera access denied. Text updates only.</span>"; });

    captureBtn.addEventListener('click', () => {
        // If they start taking pictures, lock the submit button so they don't submit half a face profile
        if (captureCount === 0) {
            submitBtn.disabled = true;
            submitBtn.style.backgroundColor = "#95a5a6";
            submitBtn.style.cursor = "not-allowed";
            statusText.style.color = "#e67e22";
            statusText.innerText = "Please complete all 5 angles to unlock save.";
        }

        if (captureCount < 5) {
            captureCount++;
            
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const imageData = canvas.toDataURL('image/jpeg');
            document.getElementById('image' + captureCount).value = imageData;
            
            captureBtn.innerText = `📷 Capture Photo (${captureCount}/5)`;
            
            if (captureCount === 5) {
                captureBtn.disabled = true;
                captureBtn.style.backgroundColor = "#7f8c8d";
                captureBtn.innerText = "✅ 5 New Photos Captured!";
                
                statusText.style.color = "#2ecc71";
                statusText.innerText = "New face data ready to save.";
                
                // Unlock the submit button again
                submitBtn.disabled = false;
                submitBtn.style.cursor = "pointer";
                submitBtn.style.backgroundColor = "#f39c12";
            }
        }
    });
</script>

</body>
</html>
